<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Smart Watering wiring: ESP8266 NodeMCU V3 + DS1302 + pump</text>

  <!-- ===================== POWER ===================== -->
  <rect x="40" y="210" width="200" height="130" rx="10" fill="#fff4f2" stroke="#e53935" stroke-width="2"/>
  <text x="140" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#b71c1c">Power</text>
  <text x="140" y="262" text-anchor="middle" font-size="12" fill="#333">18650  3.0-4.2 V</text>
  <text x="140" y="282" text-anchor="middle" font-size="12" fill="#333">TP4056 + boost</text>
  <text x="140" y="302" text-anchor="middle" font-size="12" fill="#333">output = 5 V</text>
  <circle cx="240" cy="250" r="4.5" fill="#e53935"/>
  <text x="232" y="246" text-anchor="end" font-size="11" font-weight="600" fill="#b71c1c">+5V</text>
  <circle cx="240" cy="312" r="4.5" fill="#424242"/>
  <text x="232" y="308" text-anchor="end" font-size="11" font-weight="600" fill="#424242">GND</text>

  <!-- ===================== NODEMCU ===================== -->
  <rect x="380" y="110" width="190" height="410" rx="12" fill="#eef3fb" stroke="#3b5bdb" stroke-width="2.5"/>
  <text x="475" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1c3faa">NodeMCU V3</text>
  <text x="475" y="156" text-anchor="middle" font-size="12" fill="#3b5bdb">ESP8266 ESP-12E</text>

  <!-- left pins -->
  <circle cx="380" cy="200" r="4.5" fill="#e53935"/>
  <text x="392" y="204" font-size="12" font-weight="600" fill="#1c3faa">VU (5V)</text>
  <circle cx="380" cy="312" r="4.5" fill="#424242"/>
  <text x="392" y="316" font-size="12" font-weight="600" fill="#1c3faa">GND</text>

  <!-- right pins -->
  <circle cx="570" cy="190" r="4.5" fill="#fb8c00"/>
  <text x="558" y="194" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">3V3</text>
  <circle cx="570" cy="225" r="4.5" fill="#1e88e5"/>
  <text x="558" y="229" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">D1</text>
  <circle cx="570" cy="260" r="4.5" fill="#43a047"/>
  <text x="558" y="264" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">D2</text>
  <circle cx="570" cy="295" r="4.5" fill="#8e24aa"/>
  <text x="558" y="299" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">D5</text>
  <circle cx="570" cy="330" r="4.5" fill="#424242"/>
  <text x="558" y="334" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">GND</text>
  <circle cx="570" cy="375" r="4.5" fill="#00897b"/>
  <text x="558" y="379" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">D6</text>
  <circle cx="570" cy="450" r="4.5" fill="#9e9e9e"/>
  <text x="558" y="454" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">D0</text>
  <circle cx="570" cy="490" r="4.5" fill="#9e9e9e"/>
  <text x="558" y="494" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">RST</text>

  <!-- ===================== DS1302 ===================== -->
  <rect x="720" y="120" width="200" height="200" rx="10" fill="#f6f0ff" stroke="#8e24aa" stroke-width="2"/>
  <text x="820" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#6a1b9a">DS1302 RTC</text>
  <text x="820" y="164" text-anchor="middle" font-size="11" fill="#6a1b9a">MH-Real-Time Clock</text>
  <circle cx="720" cy="195" r="4.5" fill="#fb8c00"/>
  <text x="732" y="199" font-size="12" font-weight="600" fill="#6a1b9a">VCC</text>
  <circle cx="720" cy="228" r="4.5" fill="#424242"/>
  <text x="732" y="232" font-size="12" font-weight="600" fill="#6a1b9a">GND</text>
  <circle cx="720" cy="261" r="4.5" fill="#1e88e5"/>
  <text x="732" y="265" font-size="12" font-weight="600" fill="#6a1b9a">CLK</text>
  <circle cx="720" cy="294" r="4.5" fill="#43a047"/>
  <text x="732" y="298" font-size="12" font-weight="600" fill="#6a1b9a">DAT</text>
  <circle cx="720" cy="313" r="4.5" fill="#8e24aa"/>
  <text x="732" y="317" font-size="12" font-weight="600" fill="#6a1b9a">RST (CE)</text>

  <!-- ===================== PUMP + MOSFET ===================== -->
  <rect x="700" y="370" width="230" height="200" rx="10" fill="#f0fff4" stroke="#43a047" stroke-width="2"/>
  <text x="815" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">Pump + MOSFET</text>
  <text x="815" y="414" text-anchor="middle" font-size="11" fill="#2e7d32">low-side switch</text>
  <text x="815" y="470" text-anchor="middle" font-size="11" fill="#333">N-MOSFET (logic-level)</text>
  <text x="815" y="488" text-anchor="middle" font-size="11" fill="#333">1k gate, 100k pulldown</text>
  <text x="815" y="506" text-anchor="middle" font-size="11" fill="#333">1N4007 flyback || pump</text>
  <circle cx="700" cy="432" r="4.5" fill="#00897b"/>
  <text x="712" y="436" font-size="12" font-weight="600" fill="#2e7d32">Gate</text>
  <circle cx="700" cy="540" r="4.5" fill="#e53935"/>
  <text x="712" y="544" font-size="12" font-weight="600" fill="#2e7d32">+5V -&gt; Pump(+)</text>

  <!-- ===================== WIRES ===================== -->
  <!-- +5V power -> VU -->
  <polyline points="240,250 310,250 310,200 380,200" fill="none" stroke="#e53935" stroke-width="2.5"/>
  <!-- +5V power -> pump (bottom rail) -->
  <polyline points="240,250 270,250 270,592 690,592 690,540 700,540" fill="none" stroke="#e53935" stroke-width="2.5"/>
  <text x="470" y="588" text-anchor="middle" font-size="11" fill="#b71c1c">+5V to pump</text>
  <!-- GND power -> NodeMCU GND(left) -->
  <polyline points="240,312 380,312" fill="none" stroke="#424242" stroke-width="2.5"/>
  <!-- 3V3 -> DS1302 VCC -->
  <polyline points="570,190 640,190 640,195 720,195" fill="none" stroke="#fb8c00" stroke-width="2.5"/>
  <!-- GND(right) -> DS1302 GND -->
  <polyline points="570,330 600,330 600,228 720,228" fill="none" stroke="#424242" stroke-width="2.5"/>
  <!-- D1 -> CLK -->
  <polyline points="570,225 655,225 655,261 720,261" fill="none" stroke="#1e88e5" stroke-width="2.5"/>
  <!-- D2 -> DAT -->
  <polyline points="570,260 645,260 645,294 720,294" fill="none" stroke="#43a047" stroke-width="2.5"/>
  <!-- D5 -> RST(CE) -->
  <polyline points="570,295 635,295 635,313 720,313" fill="none" stroke="#8e24aa" stroke-width="2.5"/>
  <!-- D6 -> Gate -->
  <polyline points="570,375 630,375 630,432 700,432" fill="none" stroke="#00897b" stroke-width="2.5"/>
  <!-- GND(right) -> pump source -->
  <polyline points="570,330 590,330 590,558 815,558" fill="none" stroke="#424242" stroke-width="2.5"/>
  <text x="700" y="554" text-anchor="middle" font-size="11" fill="#424242">Source / Pump(-) -&gt; GND</text>
  <!-- D0 <-> RST jumper -->
  <polyline points="570,450 605,450 605,490 570,490" fill="none" stroke="#9e9e9e" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="612" y="474" font-size="11" font-weight="600" fill="#616161">jumper (wake)</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="380" width="300" height="190" rx="10" fill="#fafafa" stroke="#cfd4da" stroke-width="1.5"/>
  <text x="56" y="404" font-size="13" font-weight="700" fill="#1f2933">Legend</text>
  <line x1="56" y1="424" x2="86" y2="424" stroke="#e53935" stroke-width="3"/>
  <text x="96" y="428" font-size="12" fill="#333">+5V (VU from boost; also Pump+)</text>
  <line x1="56" y1="448" x2="86" y2="448" stroke="#fb8c00" stroke-width="3"/>
  <text x="96" y="452" font-size="12" fill="#333">+3V3 -&gt; DS1302 VCC</text>
  <line x1="56" y1="472" x2="86" y2="472" stroke="#424242" stroke-width="3"/>
  <text x="96" y="476" font-size="12" fill="#333">GND (common ground)</text>
  <line x1="56" y1="496" x2="86" y2="496" stroke="#1e88e5" stroke-width="3"/>
  <text x="96" y="500" font-size="12" fill="#333">D1 -&gt; CLK   /   <tspan fill="#43a047">D2 -&gt; DAT</tspan></text>
  <line x1="56" y1="520" x2="86" y2="520" stroke="#8e24aa" stroke-width="3"/>
  <text x="96" y="524" font-size="12" fill="#333">D5 -&gt; RST(CE)  /  <tspan fill="#00897b">D6 -&gt; Gate</tspan></text>
  <line x1="56" y1="544" x2="86" y2="544" stroke="#9e9e9e" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="96" y="548" font-size="12" fill="#333">D0 &lt;-&gt; RST (deep-sleep jumper)</text>
</svg>
