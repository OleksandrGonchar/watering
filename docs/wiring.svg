<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="740" viewBox="0 0 980 740" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="740" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">Smart Watering wiring: NodeMCU + DS1302 + pump + PCF8574</text>

  <!-- ===================== POWER ===================== -->
  <rect x="40" y="210" width="200" height="130" rx="10" fill="#fff4f2" stroke="#e53935" stroke-width="2"/>
  <text x="140" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#b71c1c">Power</text>
  <text x="140" y="262" text-anchor="middle" font-size="12" fill="#333">18650  3.0-4.2 V</text>
  <text x="140" y="282" text-anchor="middle" font-size="12" fill="#333">TP4056 + boost</text>
  <text x="140" y="302" text-anchor="middle" font-size="12" fill="#333">output = 5 V</text>
  <circle cx="240" cy="250" r="4.5" fill="#e53935"/>
  <text x="232" y="246" text-anchor="end" font-size="11" font-weight="600" fill="#b71c1c">+5V</text>
  <circle cx="240" cy="312" r="4.5" fill="#424242"/>
  <text x="232" y="308" text-anchor="end" font-size="11" font-weight="600" fill="#424242">GND</text>

  <!-- ===================== NODEMCU ===================== -->
  <rect x="380" y="90" width="190" height="480" rx="12" fill="#eef3fb" stroke="#3b5bdb" stroke-width="2.5"/>
  <text x="475" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1c3faa">NodeMCU V3</text>
  <text x="475" y="136" text-anchor="middle" font-size="12" fill="#3b5bdb">ESP8266 ESP-12E</text>

  <!-- left pins -->
  <circle cx="380" cy="200" r="4.5" fill="#e53935"/>
  <text x="392" y="204" font-size="12" font-weight="600" fill="#1c3faa">VU (5V)</text>
  <circle cx="380" cy="312" r="4.5" fill="#424242"/>
  <text x="392" y="316" font-size="12" font-weight="600" fill="#1c3faa">GND</text>

  <!-- right pins -->
  <circle cx="570" cy="170" r="4.5" fill="#fb8c00"/>
  <text x="558" y="174" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">3V3</text>
  <circle cx="570" cy="205" r="4.5" fill="#1e88e5"/>
  <text x="558" y="209" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">D1</text>
  <circle cx="570" cy="240" r="4.5" fill="#43a047"/>
  <text x="558" y="244" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">D2</text>
  <circle cx="570" cy="275" r="4.5" fill="#8e24aa"/>
  <text x="558" y="279" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">D5</text>
  <circle cx="570" cy="310" r="4.5" fill="#424242"/>
  <text x="558" y="314" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">GND</text>
  <circle cx="570" cy="350" r="4.5" fill="#00897b"/>
  <text x="558" y="354" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">D6</text>
  <circle cx="570" cy="385" r="4.5" fill="#c62828"/>
  <text x="558" y="389" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">D8</text>
  <circle cx="570" cy="430" r="4.5" fill="#00897b"/>
  <text x="558" y="434" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">D3 SDA</text>
  <circle cx="570" cy="465" r="4.5" fill="#8e24aa"/>
  <text x="558" y="469" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">D4 SCL</text>
  <circle cx="570" cy="510" r="4.5" fill="#9e9e9e"/>
  <text x="558" y="514" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">D0</text>
  <circle cx="570" cy="545" r="4.5" fill="#9e9e9e"/>
  <text x="558" y="549" text-anchor="end" font-size="12" font-weight="600" fill="#1c3faa">RST</text>

  <!-- ===================== DS1302 ===================== -->
  <rect x="720" y="100" width="200" height="200" rx="10" fill="#f6f0ff" stroke="#8e24aa" stroke-width="2"/>
  <text x="820" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#6a1b9a">DS1302 RTC</text>
  <text x="820" y="144" text-anchor="middle" font-size="11" fill="#6a1b9a">MH-Real-Time Clock</text>
  <circle cx="720" cy="175" r="4.5" fill="#fb8c00"/>
  <text x="732" y="179" font-size="12" font-weight="600" fill="#6a1b9a">VCC</text>
  <circle cx="720" cy="208" r="4.5" fill="#424242"/>
  <text x="732" y="212" font-size="12" font-weight="600" fill="#6a1b9a">GND</text>
  <circle cx="720" cy="241" r="4.5" fill="#1e88e5"/>
  <text x="732" y="245" font-size="12" font-weight="600" fill="#6a1b9a">CLK</text>
  <circle cx="720" cy="274" r="4.5" fill="#43a047"/>
  <text x="732" y="278" font-size="12" font-weight="600" fill="#6a1b9a">DAT</text>
  <circle cx="720" cy="293" r="4.5" fill="#8e24aa"/>
  <text x="732" y="297" font-size="12" font-weight="600" fill="#6a1b9a">RST (CE)</text>

  <!-- ===================== PUMP + NPN ===================== -->
  <rect x="700" y="330" width="230" height="130" rx="10" fill="#f0fff4" stroke="#43a047" stroke-width="2"/>
  <text x="815" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">Pump + NPN switch</text>
  <text x="815" y="374" text-anchor="middle" font-size="11" fill="#2e7d32">low-side switch</text>
  <text x="815" y="400" text-anchor="middle" font-size="11" fill="#333">NPN S8050 / BC337</text>
  <text x="815" y="418" text-anchor="middle" font-size="11" fill="#333">220R base, 10k pulldown</text>
  <text x="815" y="436" text-anchor="middle" font-size="11" fill="#333">SB10100 flyback || pump</text>
  <circle cx="700" cy="392" r="4.5" fill="#00897b"/>
  <text x="712" y="396" font-size="12" font-weight="600" fill="#2e7d32">Base (220R)</text>
  <circle cx="700" cy="440" r="4.5" fill="#e53935"/>
  <text x="712" y="444" font-size="12" font-weight="600" fill="#2e7d32">+5V -&gt; Pump(+)</text>

  <!-- ===================== HUMIDIFIER POWER ===================== -->
  <rect x="700" y="490" width="230" height="90" rx="10" fill="#fff8e1" stroke="#c62828" stroke-width="2"/>
  <text x="815" y="516" text-anchor="middle" font-size="14" font-weight="700" fill="#b71c1c">Humidifier + motor V+</text>
  <text x="815" y="536" text-anchor="middle" font-size="11" fill="#b71c1c">MOSFET/relay on D8 (boot LOW)</text>
  <text x="815" y="556" text-anchor="middle" font-size="11" fill="#333">Direction relay on PCF P5</text>
  <circle cx="700" cy="530" r="4.5" fill="#c62828"/>
  <text x="712" y="534" font-size="12" font-weight="600" fill="#b71c1c">Gate / IN (D8)</text>

  <!-- ===================== PCF NOTE ===================== -->
  <rect x="700" y="600" width="230" height="80" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="815" y="626" text-anchor="middle" font-size="13" font-weight="700" fill="#f57f17">PCF8574 (required)</text>
  <text x="815" y="646" text-anchor="middle" font-size="11" fill="#333">I2C D3/D4 → see wiring-alerts.svg</text>
  <text x="815" y="664" text-anchor="middle" font-size="11" fill="#333">P0..P7 safety + motion</text>

  <!-- ===================== WIRES ===================== -->
  <polyline points="240,250 310,250 310,200 380,200" fill="none" stroke="#e53935" stroke-width="2.5"/>
  <polyline points="240,250 270,250 270,440 700,440" fill="none" stroke="#e53935" stroke-width="2.5"/>
  <text x="470" y="436" text-anchor="middle" font-size="11" fill="#b71c1c">+5V to pump</text>
  <polyline points="240,312 380,312" fill="none" stroke="#424242" stroke-width="2.5"/>
  <polyline points="570,170 640,170 640,175 720,175" fill="none" stroke="#fb8c00" stroke-width="2.5"/>
  <polyline points="570,310 600,310 600,208 720,208" fill="none" stroke="#424242" stroke-width="2.5"/>
  <polyline points="570,205 655,205 655,241 720,241" fill="none" stroke="#1e88e5" stroke-width="2.5"/>
  <polyline points="570,240 645,240 645,274 720,274" fill="none" stroke="#43a047" stroke-width="2.5"/>
  <polyline points="570,275 635,275 635,293 720,293" fill="none" stroke="#8e24aa" stroke-width="2.5"/>
  <polyline points="570,350 630,350 630,392 700,392" fill="none" stroke="#00897b" stroke-width="2.5"/>
  <polyline points="570,385 660,385 660,530 700,530" fill="none" stroke="#c62828" stroke-width="2.5"/>
  <polyline points="570,430 650,430 650,630 700,630" fill="none" stroke="#00897b" stroke-width="2" stroke-dasharray="5 3"/>
  <polyline points="570,465 640,465 640,650 700,650" fill="none" stroke="#8e24aa" stroke-width="2" stroke-dasharray="5 3"/>
  <polyline points="570,310 590,310 590,460 815,460" fill="none" stroke="#424242" stroke-width="2.5"/>
  <text x="700" y="456" text-anchor="middle" font-size="11" fill="#424242">Emitter / Pump(-) -&gt; GND</text>
  <polyline points="570,510 605,510 605,545 570,545" fill="none" stroke="#9e9e9e" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="612" y="532" font-size="11" font-weight="600" fill="#616161">jumper (wake)</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="380" width="300" height="240" rx="10" fill="#fafafa" stroke="#cfd4da" stroke-width="1.5"/>
  <text x="56" y="404" font-size="13" font-weight="700" fill="#1f2933">Legend</text>
  <line x1="56" y1="424" x2="86" y2="424" stroke="#e53935" stroke-width="3"/>
  <text x="96" y="428" font-size="12" fill="#333">+5V (VU from boost; Pump+)</text>
  <line x1="56" y1="448" x2="86" y2="448" stroke="#fb8c00" stroke-width="3"/>
  <text x="96" y="452" font-size="12" fill="#333">+3V3 -&gt; DS1302 + PCF VCC</text>
  <line x1="56" y1="472" x2="86" y2="472" stroke="#424242" stroke-width="3"/>
  <text x="96" y="476" font-size="12" fill="#333">GND (common ground)</text>
  <line x1="56" y1="496" x2="86" y2="496" stroke="#1e88e5" stroke-width="3"/>
  <text x="96" y="500" font-size="12" fill="#333">D1 -&gt; CLK   /   <tspan fill="#43a047">D2 -&gt; DAT</tspan></text>
  <line x1="56" y1="520" x2="86" y2="520" stroke="#8e24aa" stroke-width="3"/>
  <text x="96" y="524" font-size="12" fill="#333">D5 -&gt; RST(CE)  /  <tspan fill="#00897b">D6 -&gt; Base</tspan></text>
  <line x1="56" y1="544" x2="86" y2="544" stroke="#c62828" stroke-width="3"/>
  <text x="96" y="548" font-size="12" fill="#333">D8 -&gt; humidifier + motor power</text>
  <line x1="56" y1="568" x2="86" y2="568" stroke="#00897b" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="96" y="572" font-size="12" fill="#333">D3/D4 I2C -&gt; PCF8574 (required)</text>
  <line x1="56" y1="592" x2="86" y2="592" stroke="#9e9e9e" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="96" y="596" font-size="12" fill="#333">D0 &lt;-&gt; RST (deep-sleep jumper)</text>
</svg>
