; PlatformIO Project Configuration File
;
; LoLin NodeMCU V3 (ESP8266 ESP-12E). The community board id `nodemcuv2`
; is electrically compatible with V3 LoLin clones using the CH340 USB chip.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = littlefs

build_flags =
    -D ARDUINOJSON_ENABLE_PROGMEM=0
    ; Optional: pin SSL fingerprint via -D SERVER_CERT_FINGERPRINT="..."
    ; Otherwise the firmware uses setInsecure() for HTTPS (acceptable for pet projects).

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    ; DS1302 RTC (MH-Real-Time Clock Module-2, 3-wire: CLK/DAT/RST).
    makuna/RTC @ ^2.5.0
    ; RTClib is kept only for its standalone DateTime class, reused across
    ; schedule.cpp / main.cpp. Adafruit BusIO is its transitive dependency.
    adafruit/RTClib @ ^2.1.4
    adafruit/Adafruit BusIO @ ^1.16.0
    ; PCF8574 I2C I/O expander (required): water-safety + humidifier motion.
    robtillaart/PCF8574 @ ^0.4.1
